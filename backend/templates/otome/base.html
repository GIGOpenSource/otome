<!DOCTYPE html>
<html lang="{{ lang|default:'zh-Hans' }}" dir="{{ dir|default:'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}乙游后台{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f0e8; color: #241c16; font-family: "Songti SC", "PingFang SC", serif; }
    a { color: #6d4e2e; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: #241c16; color: #f6efe4; }
    header a { color: #e7c27a; text-decoration: none; margin-left: 18px; }
    header strong { font-size: 18px; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .sub { color: #6d645b; line-height: 1.6; margin-bottom: 22px; }
    .card { background: #fffdf8; border: 1px solid #e4d8c4; border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #8a6a3b; margin-bottom: 6px; }
    input[type="text"], input[type="url"], input[type="number"], input[type="password"], textarea, select {
      width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #e4d8c4; border-radius: 10px; background: #fff; color: #241c16; font: inherit;
    }
    textarea { min-height: 110px; }
    button, .btn { border: 0; border-radius: 999px; background: #241c16; color: #f6efe4; padding: 10px 18px; cursor: pointer; font: inherit; text-decoration: none; display: inline-block; }
    .ghost { background: transparent; color: #241c16; border: 1px solid #c8b89a; }
    .danger { background: #8d3b32; }
    .row { margin-bottom: 10px; }
    .error { background: #fde8e4; color: #8d3b32; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
    .id { font-family: ui-monospace, monospace; background: #241c16; color: #e7c27a; padding: 2px 8px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #efe6d6; vertical-align: top; }
    img.thumb { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; background: #efe6d6; }
    .check { display: flex; align-items: center; margin-bottom: 10px; }
    .check input { width: auto; margin: 0 8px 0 0; }
    .split { display: flex; }
    .split > * { margin-right: 12px; }
    code { font-family: ui-monospace, monospace; font-size: 13px; }
    .tag { display: inline-block; margin: 0 6px 6px 0; padding: 2px 8px; border-radius: 999px; background: #241c16; color: #e7c27a; font-size: 12px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .filters input, .filters select { width: auto; min-width: 140px; margin-bottom: 0; }
    .tag-form label { display: inline-flex; width: auto; margin-right: 12px; }
    .pager a, .pager span { margin-right: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .tabs .tab { background: transparent; color: #241c16; border: 1px solid #c8b89a; }
    .tabs .tab.on { background: #241c16; color: #e7c27a; border-color: #241c16; }
    .tab-panel { display: none; }
    .tab-panel.on { display: block; }
  </style>
</head>
<body>
  <header>
    <strong>{% if ui %}{{ ui.brand }}{% else %}乙游管理面板{% endif %}</strong>
    <nav>
      <a href="/otome-admin/">游戏列表</a>
      <a href="/otome-admin/data/">数据列表</a>
      <a href="/otome-admin/users/">用户列表</a>
      <a href="/otome-admin/ads/">广告</a>
      {% if request.path != "/otome-admin/login/" %}
      <a href="/otome-admin/logout/">退出</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.querySelector('[data-tabs]')
      if (!root) return
      var buttons = root.querySelectorAll('[data-tab]')
      var panels = document.querySelectorAll('[data-panel]')
      var stay = document.querySelectorAll('input[name="stay_tab"]')
      function show(name) {
        var known = false
        buttons.forEach(function (btn) {
          if (btn.getAttribute('data-tab') === name) known = true
        })
        if (!known && buttons[0]) name = buttons[0].getAttribute('data-tab')
        buttons.forEach(function (btn) {
          btn.classList.toggle('on', btn.getAttribute('data-tab') === name)
        })
        panels.forEach(function (panel) {
          panel.classList.toggle('on', panel.getAttribute('data-panel') === name)
        })
        stay.forEach(function (input) { input.value = name })
      }
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () { show(btn.getAttribute('data-tab')) })
      })
      show(root.getAttribute('data-current') || '')
    })
  </script>
</body>
</html>
