networks:
  buildmart_net:
    name: buildmart_net

volumes:
  redisdata:
    driver: local

services:
  redis:
    image: redis:7-alpine
    container_name: buildmart_redis
    command: redis-server --requirepass change-me
    ports:
      - "6389:6379"
    volumes:
      - redisdata:/data
    networks:
      - buildmart_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3