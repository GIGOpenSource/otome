# 三个 HTTPS server 共用的 location，由 nginx.conf include。
# 静态站来自宿主机 page/（frontend、admin、agreement、file）。

location /api/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }
    proxy_pass http://otome_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "*" always;
    add_header Access-Control-Max-Age 86400 always;
}

location /media/ {
    alias /usr/share/nginx/html/media/;
    expires 7d;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Content-Range, Accept-Ranges" always;
    add_header Access-Control-Max-Age 86400 always;
}

location /go/ {
    proxy_pass http://otome_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /land/ {
    proxy_pass http://otome_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /otome-admin/ {
    proxy_pass http://otome_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
}

location = /admin {
    return 301 /admin/;
}

location /agreement/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
}

location /file/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
}

# 进入游戏的地址是 /故事编码/。uni-app base 为 ./ 时，assets 与 static 都会变成相对路径
# （例如 ./static/play/dialog-npc.svg → /编码/static/...），要指回前端根目录，不能再退回 index.html。
location ~ ^/(?!admin|agreement|file)([^/]+)/assets/(.*)$ {
    root /usr/share/nginx/html/frontend;
    try_files /assets/$2 =404;
}

location /static/ {
    root /usr/share/nginx/html/frontend;
    expires 7d;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
}

location ~ ^/(?!admin|agreement|file)([^/]+)/static/(.*)$ {
    root /usr/share/nginx/html/frontend;
    expires 7d;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    try_files /static/$2 =404;
}

location / {
    root /usr/share/nginx/html/frontend;
    index index.html;
    try_files $uri $uri/ /index.html;
}
