worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 40m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    upstream otome_backend {
        server backend:8001;
    }

    server {
        listen 80;
        server_name caoxi.live ruxi.ink caoxi.life www.caoxi.live www.ruxi.ink www.caoxi.life;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html/file;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 主机 IP 直接访问（HTTP，不跳 HTTPS）
    server {
        listen 80;
        server_name 139.162.109.171;
        include /etc/nginx/otome-locations.conf;
    }

    # 证书在 page/cert/，三个域名共用 page/frontend、page/admin 等静态站
    server {
        listen 443 ssl;
        server_name caoxi.live www.caoxi.live;
        ssl_certificate /etc/nginx/certs/jnacaoxi_live.crt;
        ssl_certificate_key /etc/nginx/certs/jnacaoxi_live.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        include /etc/nginx/otome-locations.conf;
    }

    server {
        listen 443 ssl;
        server_name ruxi.ink www.ruxi.ink;
        ssl_certificate /etc/nginx/certs/jnaruxi_ink.crt;
        ssl_certificate_key /etc/nginx/certs/jnaruxi_ink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        include /etc/nginx/otome-locations.conf;
    }

    server {
        listen 443 ssl;
        server_name caoxi.life www.caoxi.life;
        ssl_certificate /etc/nginx/certs/jnacaoxi_life.crt;
        ssl_certificate_key /etc/nginx/certs/jnacaoxi_life.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        include /etc/nginx/otome-locations.conf;
    }
}
