# 先复制 .env.example 为 .env，填上自己的数据库、Redis 和对象存储。
# 依赖有变化时先打基础镜像，后端镜像继承它：
#   docker build -f Dockerfile.base -t otome-base:v1 .
# 再启动：
#   docker compose up --build -d
#
# 对象存储由 STORAGE_BACKEND 选择：1=GCS，2=COS，3=MinIO；上传返回公开 URL。
# Nginx：三个域名共用 page/ 静态站；证书在 page/cert/。
# backend/media 会在后端容器启动时复制到 ./media。改 nginx.conf / locations 需重建 nginx 镜像。

networks:
  otome_net:

services:
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: otome-nginx:latest
    container_name: otome-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - otome_net
    volumes:
      - ./page/frontend:/usr/share/nginx/html/frontend:ro
      - ./page/admin:/usr/share/nginx/html/admin:ro
      - ./page/agreement:/usr/share/nginx/html/agreement:ro
      - ./page/file:/usr/share/nginx/html/file:ro
      - ./page/cert:/etc/nginx/certs:ro
      - ./media:/usr/share/nginx/html/media:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: otome-backend:latest
    container_name: otome-backend
    restart: always
    networks:
      - otome_net
    volumes:
      - ./media:/app/media
      - ./backend/media:/opt/otome/seed-media:ro
    environment:
      TZ: Asia/Shanghai
      DJANGO_SETTINGS_MODULE: uivsbe_backend.settings.pro
      POSTGRES_BUILDMART_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
      REDIS_BUILDMART_HOST: redis
      REDIS_PORT: "6379"
      REDIS_BUILDMART_PASSWORD: ${REDIS_PASSWORD}
      OTOME_ADMIN_KEY: ${OTOME_ADMIN_KEY}
      OTOME_ADMIN_USER: ${OTOME_ADMIN_USER:-admin}
      OTOME_ADMIN_PASSWORD: ${OTOME_ADMIN_PASSWORD}
      OTOME_ADMIN_EMAIL: ${OTOME_ADMIN_EMAIL:-admin@example.com}
      OTOME_FRONTEND_BASE: ${OTOME_FRONTEND_BASE}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-2}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_DOMAIN: ${COS_DOMAIN:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_CREDENTIALS: ${GCS_CREDENTIALS:-}
      GCS_PUBLIC_BASE_URL: ${GCS_PUBLIC_BASE_URL:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_SECURE: ${MINIO_SECURE:-0}
      MINIO_PUBLIC_BASE: ${MINIO_PUBLIC_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  postgres:
    image: postgres:16
    container_name: otome-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otome}
      POSTGRES_USER: ${POSTGRES_USER:-otome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    # 仅本机可连，不对公网暴露
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - otome_postgres:/var/lib/postgresql/data
    networks:
      - otome_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: otome-redis
    restart: always
    networks:
      - otome_net
    volumes:
      - otome_redis:/data
    # 必须在 .env 填写非空 REDIS_PASSWORD；空密码会导致 requirepass 吞掉后续参数
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  otome_postgres:
  otome_redis:
